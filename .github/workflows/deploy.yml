name: Deploy to GitHub Pages

on:
  # The `release` branch is the deploy branch. Every commit to it deploys.
  # It receives:
  #   - .sav commits, pushed directly by scripts/push-save.sh (via PAT) — these
  #     fire this `push` trigger normally.
  #   - dev commits, merged from `main` by sync-release.yml. That workflow pushes
  #     with the default GITHUB_TOKEN, which by design does NOT fire `push` events
  #     on other workflows, so it can't rely on this trigger. Instead it *calls*
  #     this workflow directly via the `workflow_call` trigger below.
  push:
    branches: [release]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Always build the tip of the deploy branch (workflow_dispatch would
          # otherwise default to checking out the default branch).
          ref: release

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate save manifest
        run: node scripts/generate-manifest.js

      - name: Download map tiles
        run: node scripts/download-tiles.mjs

      - name: Download resource node icons
        run: node scripts/download-resource-icons.mjs

      - name: Download collectible icons
        run: node scripts/download-collectible-icons.mjs

      - name: Build
        run: npm run build
        env:
          VITE_BASE_URL: /satisfactory/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
