name: Deploy to GitHub Pages

on:
  # The `release` branch is the deploy branch. It receives:
  #   - dev commits, merged from `main` by sync-release.yml
  #   - .sav commits, pushed directly by scripts/push-save.sh (via PAT)
  # Save pushes use a PAT, so they fire this `push` trigger normally. The sync
  # workflow pushes with the default GITHUB_TOKEN, which by design does NOT fire
  # `push` events on other workflows — so we deploy off its completion instead.
  push:
    branches: [release]
  workflow_run:
    workflows: ["Sync release branch"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # When triggered by the sync workflow, only proceed if it succeeded.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Always build the tip of the deploy branch, regardless of which event
          # triggered us (a workflow_run defaults to checking out the default branch).
          ref: release

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate save manifest
        run: node scripts/generate-manifest.js

      - name: Download map tiles
        run: node scripts/download-tiles.mjs

      - name: Download resource node icons
        run: node scripts/download-resource-icons.mjs

      - name: Download collectible icons
        run: node scripts/download-collectible-icons.mjs

      - name: Build
        run: npm run build
        env:
          VITE_BASE_URL: /satisfactory/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
