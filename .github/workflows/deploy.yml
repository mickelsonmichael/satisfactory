name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate save manifest
        run: node scripts/generate-manifest.js

      - name: Download map tiles
        run: node scripts/download-tiles.mjs

      - name: Download resource node icons
        run: node scripts/download-resource-icons.mjs

      - name: Download collectible icons
        run: node scripts/download-collectible-icons.mjs

      - name: Build
        run: npm run build
        env:
          VITE_BASE_URL: /satisfactory/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
