# Auto-upload pipeline reference (no active workflow needed)
#
# Deploys come off the dedicated `release` branch, not `main`:
#   - Pushes to `main` (real dev work) are merged onto `release` by
#     sync-release.yml, which then triggers deploy.yml.
#   - Saves are pushed straight to `release` by scripts/push-save.sh, keeping
#     `main`'s history free of frequent "chore: update save" commits.
# Either path makes `deploy.yml` regenerate the manifest and redeploy Pages.
#
# ── How saves get pushed ────────────────────────────────────────────────────────
# `scripts/push-save.sh` runs on the game server (containerized via Portainer,
# alongside the dedicated server). On a schedule it:
#   1. Clones/syncs this repo (the `release` branch)
#   2. Copies the newest .sav into `public/saves/satisfactory.<date>.sav`
#   3. Regenerates `public/saves/manifest.json`
#   4. Commits and pushes to `release` (auth via DEPLOY_TOKEN PAT; fine-grained:
#      Contents "Read and write", or classic: `repo` / `public_repo`)
#   5. `deploy.yml` then rebuilds and redeploys Pages automatically
#
# See the header of scripts/push-save.sh for the full list of environment vars.
#
# ── If you ever DO want a server-independent CI regen ───────────────────────────
# (e.g. saves are added by some other process that doesn't run the manifest step)
# uncomment the workflow below. It regenerates the manifest in CI and commits it.
# It is intentionally disabled because deploy.yml already covers this case.
