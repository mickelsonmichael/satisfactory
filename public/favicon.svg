<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark navy background -->
  <rect width="32" height="32" rx="7" fill="#1e2235"/>

  <!-- Gear body -->
  <circle cx="16" cy="16" r="10" fill="#E87D3E"/>

  <!-- 8 teeth, evenly spaced at 45° intervals, all centered on the gear axis -->
  <rect x="14.5" y="2" width="3" height="7" rx="1" fill="#E87D3E"/>
  <rect x="14.5" y="2" width="3" height="7" rx="1" fill="#E87D3E" transform="rotate(45 16 16)"/>
  <rect x="14.5" y="2" width="3" height="7" rx="1" fill="#E87D3E" transform="rotate(90 16 16)"/>
  <rect x="14.5" y="2" width="3" height="7" rx="1" fill="#E87D3E" transform="rotate(135 16 16)"/>
  <rect x="14.5" y="2" width="3" height="7" rx="1" fill="#E87D3E" transform="rotate(180 16 16)"/>
  <rect x="14.5" y="2" width="3" height="7" rx="1" fill="#E87D3E" transform="rotate(225 16 16)"/>
  <rect x="14.5" y="2" width="3" height="7" rx="1" fill="#E87D3E" transform="rotate(270 16 16)"/>
  <rect x="14.5" y="2" width="3" height="7" rx="1" fill="#E87D3E" transform="rotate(315 16 16)"/>

  <!-- Center hole -->
  <circle cx="16" cy="16" r="4" fill="#1e2235"/>
</svg>
